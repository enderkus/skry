# Integration test fleet. Started by tests/integration_docker.rs when
# SKRY_DOCKER_TESTS=1; the harness supplies SKRY_TEST_PUBKEY.
name: skry-it

x-common: &common
  environment:
    SKRY_TEST_PUBKEY: ${SKRY_TEST_PUBKEY:-}
  networks: [fleet]

services:
  debian:
    <<: *common
    build: { context: ., dockerfile: Dockerfile.debian }
    ports: ["127.0.0.1:${SKRY_IT_PORT_BASE:-2220}1:22"]
  ubuntu:
    <<: *common
    build: { context: ., dockerfile: Dockerfile.ubuntu }
    ports: ["127.0.0.1:${SKRY_IT_PORT_BASE:-2220}2:22"]
  rocky:
    <<: *common
    build: { context: ., dockerfile: Dockerfile.rocky }
    ports: ["127.0.0.1:${SKRY_IT_PORT_BASE:-2220}3:22"]
  alpine:
    <<: *common
    build: { context: ., dockerfile: Dockerfile.alpine }
    ports: ["127.0.0.1:${SKRY_IT_PORT_BASE:-2220}4:22"]
  bastion:
    <<: *common
    build: { context: ., dockerfile: Dockerfile.alpine }
    ports: ["127.0.0.1:${SKRY_IT_PORT_BASE:-2220}0:22"]
  # Reachable only through the bastion.
  hidden:
    <<: *common
    build: { context: ., dockerfile: Dockerfile.debian }

networks:
  fleet: {}
