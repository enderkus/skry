<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>skry documentation</title>
<meta name="robots" content="noindex">
<script>
  // Pick the documentation language from the browser, English otherwise.
  var tr = (navigator.languages || [navigator.language || ""]).some(function (l) { return /^tr/i.test(l); });
  location.replace(tr ? "tr/" : "en/");
</script>
<noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
</head>
<body>
<p><a href="en/">English documentation</a> · <a href="tr/">Türkçe dokümantasyon</a></p>
</body>
</html>
